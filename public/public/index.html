<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Reel & Docu AI</title>

    <style>
        body {
            background: #0f0f0f;
            font-family: Arial, sans-serif;
            color: #fff;
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .box {
            background: #1f1f1f;
            padding: 20px;
            border-radius: 10px;
            max-width: 450px;
            margin: 20px auto;
        }

        button {
            background: #4CAF50;
            border: none;
            padding: 12px 20px;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

    <h1>Auto Reel & Docu AI</h1>

    <div class="box">
        <p>Upload your video and generate:</p>
        <ul style="text-align:left; display:inline-block;">
            <li>Auto Reels</li>
            <li>AI Captions</li>
            <li>Auto Documentation</li>
        </ul>
        
        <input type="file" id="videoInput">
        <br><br>
        <button>Generate</button>
    </div>

</body>
</html>
